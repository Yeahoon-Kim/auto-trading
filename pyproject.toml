[project]
name = "autotrader"
version = "0.1.0"
description = "AI·알고리즘 기반 자동매매: 전략 리서치 → 백테스트 → 모의투자 → 실전"
requires-python = ">=3.12,<3.13"
dependencies = [
    # 데이터/분석
    "pandas>=2.2",
    "numpy>=2.0",
    "pyarrow>=17",          # parquet 저장
    "duckdb>=1.1",          # 로컬 데이터 쿼리
    # 설정/유틸
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "loguru>=0.7",
    "httpx>=0.27",
    "websockets>=13",
    "pykrx>=1.0.51",
    "finance-datareader>=0.9.202",
    "yfinance>=1.7.0",
    "lxml>=6.1.3",
]

[project.optional-dependencies]
# 실제 사용할 때 필요한 것만 골라 설치: uv sync --extra research
research = [
    "jupyterlab>=4.2",
    "matplotlib>=3.9",
    "plotly>=5.24",
    "statsmodels>=0.14",    # 회귀·공적분(페어트레이딩)
    "scikit-learn>=1.5",
    "pykrx>=1.0",           # KRX 과거 시세·재무
    "finance-datareader>=0.9",
    "OpenDartReader>=0.2",  # DART 재무제표 (다모다란식 밸류에이션용)
    "yfinance>=0.2",
]
backtest = [
    "vectorbt>=0.26",       # 벡터 백테스트 (빠른 파라미터 탐색)
    "quantstats>=0.0.62",   # 성과 리포트
]
crypto = [
    "ccxt>=4.4",            # 거래소 공통 인터페이스 (차익거래용 다거래소)
    "python-binance>=1.0",
]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autotrader"]

[tool.ruff]
line-length = 100
