id: L013-us
name: us-ma-support   # US 참고 실행 (생존편향, 판정 근거 아님)
version: 1
status: backtesting
category: classic
type: trade

trade:                   # 세 lab(L013·L014·L015) 공통, 결과 보기 전에 정함
  risk_per_trade_pct: 1.0
  max_heat_pct: 10.0
  max_position_pct: 10.0
  max_sector_pct:
  max_open_positions: 10
  kelly: none

market: us_stock
universe: ALL            # us_1d = S&P500·Nasdaq100 현재 구성종목 → 생존편향 있음
timeframe: 1d
data_start: "2010-01-01"
fields: [high, low, volume, raw_close]
fill: next_open

execution:
  capital: 10000          # USD

paper:
  krw_per_unit: 1400     # 주문 상한 기록 환산용 고정 환율

data_snapshot: ""

trials:
  count: 1
  exposed_from: [L003, L013]   # L003 US 결과 + 같은 규칙의 KR lab
  log:
    - "2026-11-19 v1: US 참고 첫 실행 — lab 엔진(민감도 포함) + placebo.py 시드 20 (KR 결과 보기 전에 함께 시작)"

walk_forward:
  start: "2011-01-01"
  train: 36M             # fit()이 학습 창 데이터만 받으므로 240일선 이벤트를 1년 이상 보려고 36개월
  test: 6M

lockbox:
  start: ""
  end: ""
  opened: false

costs:
  fee_pct:
  slippage_pct:
  tax_pct_sell:

params:
  ma_periods: [5, 10, 20, 50, 100, 125, 200]   # 사용자 지정 (US)
  touch_pct: 0.01        # 저가가 이평 + 1% 안까지 내려오면 터치
  stop_buf: 0.01         # 지지선 아래 1%
  tgt_buf: 0.005         # 저항 바로 아래 0.5%에서 익절
  res_n: 60              # 저항 후보: 직전 60봉 고점 (그리고 250봉 고점·위쪽 이평)
  rr_min: 3.0            # 사용자 지정 손익비
  max_new: 5             # 하루 새 신호 상한 (점수·거래대금 순)
  min_value: 10000000   # 20일 평균 거래대금 1,000만 달러
  min_price: 5
  fit_horizon: 60        # 학습용 결과 시뮬레이션 최대 보유 봉
  fit_cost: 0.006        # 학습용 왕복 비용 근사 (US 수수료 0.25%×2 + 슬리피지)
  shrink_n: 200          # 가중값 축소: n/(n+200)

benchmark: SPY_tr_wht

retirement:
  max_drawdown_pct:
  max_losing_days:
  custom: ""
