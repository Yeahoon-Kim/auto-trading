id: L015-us
name: us-volume-breakout   # US 참고 실행 (생존편향, 판정 근거 아님)
version: 1
status: backtesting
category: classic
type: trade

trade:                   # 세 lab(L013·L014·L015) 공통, 결과 보기 전에 정함
  risk_per_trade_pct: 1.0
  max_heat_pct: 10.0
  max_position_pct: 10.0
  max_sector_pct:
  max_open_positions: 10
  kelly: none

market: us_stock
universe: ALL            # us_1d = S&P500·Nasdaq100 현재 구성종목 → 생존편향 있음
timeframe: 1d
data_start: "2010-01-01"
fields: [high, low, volume, raw_close]
fill: next_open

execution:
  capital: 10000          # USD

paper:
  krw_per_unit: 1400     # 주문 상한 기록 환산용 고정 환율

data_snapshot: ""

trials:
  count: 1
  exposed_from: [L003, L015]   # L003 US 결과 + 같은 규칙의 KR lab
  log:
    - "2026-11-19 v1: US 참고 첫 실행 — lab 엔진(민감도 포함) + placebo.py 시드 20 (KR 결과 보기 전에 함께 시작)"

walk_forward:
  start: "2011-01-01"
  train: 36M             # 세 lab 같은 창
  test: 6M

lockbox:
  start: ""
  end: ""
  opened: false

costs:
  fee_pct:
  slippage_pct:
  tax_pct_sell:

params:
  ma_periods: [5, 10, 20, 50, 100, 125, 200]   # 다음 저항 후보 이평 (사용자 지정 US)
  brk_mas: [50, 100, 200]                 # 돌파 대상 이평 (US)
  brk_n: 60              # 전고점 = 직전 60봉 고가 최대
  vol_mult: 2.0          # 거래량 ≥ 직전 20봉 평균 × 2
  fail_buf: 0.02         # 돌파선 2% 아래로 되밀리면 실패 → 손절
  tgt_buf: 0.005
  res_n: 250             # 다음 저항 후보: 직전 250봉 고점 (그리고 위쪽 이평)
  rr_min: 3.0
  max_new: 5
  min_value: 10000000   # 20일 평균 거래대금 1,000만 달러
  min_price: 5

benchmark: SPY_tr_wht

retirement:
  max_drawdown_pct:
  max_losing_days:
  custom: ""
