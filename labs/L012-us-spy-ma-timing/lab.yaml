id: L012
name: us-spy-ma-timing
version: 1               # 잠금 구간을 본 뒤 전략을 고치면 +1 하고 다시 검증
status: validating            # draft | backtesting | validating | validated | rejected | needs-more | paper | live | retired
category: classic        # classic | intraday | algo | arbitrage | llm  (연구 분류)
type: portfolio          # 실행 유형 (docs/architecture.md §10). 비우면 portfolio
                         #   portfolio: generate_signals()가 날짜×종목 목표 비중을 낸다. 비중이 곧 사이징 (종목 수·비중은 전략이 정함)
                         #   trade:     generate_trades()가 진입 신호(손절가·목표가·당일 청산)를 낸다. 사이징은 아래 trade 블록,
                         #              손절·목표가·장 마감 전 청산은 데스크와 같은 코드로 재생 (backtest/trade.py, 고가·저가 자동 로드)
                         #              자본은 execution.capital, 원화 아닌 계좌는 paper.krw_per_unit 필요. fill·rebalance는 안 씀

trade:                   # type: trade 일 때만. 비우면 config/risk.yaml trade.defaults, 상한(caps)은 넘을 수 없음
  risk_per_trade_pct:    # 거래당 위험 (손절까지 잃는 돈 / 총자산 %)
  max_heat_pct:          # 열린 포지션 전체 위험 합계 %
  max_position_pct:      # 종목 하나 최대 비중 %
  max_sector_pct:
  max_open_positions:
  kelly:                 # half | none

paper:                   # 모의 운용 설정 (선택, autotrader.runner.paper)
  capital:               # 비우면 execution.capital, 그것도 없으면 settings backtest.initial_capital_krw
  limit_band_pct:        # 지정가 = 종가 ± 이 비율 (기본 5). 다음 날 시가가 밖이면 취소
  krw_per_unit:          # 계좌 통화가 원화가 아니면 필수 (crypto_spot: USDT 1개 = 몇 원) — 주문 상한 환산용

llm:                     # category: llm 일 때만
  model: ""              # 모델 ID (바꾸면 version +1)
  knowledge_cutoff: ""   # 이 날짜 이후 데이터로만 백테스트 가능
  prompt_version: 1
  consistency_runs: 5    # 같은 입력 반복 판단 횟수
  baselines: [buy_and_hold, momentum, random]
  forward_start: ""      # 앞으로 검증 시작일 (최소 60거래일)
market: us_stock         # kr_stock | us_stock | crypto_spot | crypto_futures | cross_market
universe: [SPY]             # 종목 목록 [005930, 000660] / ALL / KOSPI·KOSDAQ(kr_stock, 그날 소속 기준)
timeframe: 1d            # 1d (주식) | 1h·4h·1d … (코인, 1분봉을 묶음)
data_start: "2010-01-01"           # 데이터 읽기 시작일 (지표 준비 기간 포함). 비우면 전체
fields: []               # open·close 외에 필요한 것: high, low, volume, value, market_cap, raw_close …
                         #   배당(kr_stock·us_stock): dps = 그날 알 수 있는 주당배당금, div_yield = dps / 원본 종가
                         #     KR: 최신 사업보고서 연간 DPS, 최초 접수일 다음 날부터 (그날 주식 기준으로 분할 환산)
                         #         우선주는 첫 우선주(예: 005935)만 값이 있다. 2우선 이하·파싱 누락은 비어 있음(NaN, 0 아님)
                         #     US: 직전 365일 정기 현금배당 합계, 배당락일부터 (us_1d close 기준, USD)
                         #   배당 필드는 엔진이 데이터를 잘라 다시 만들어 시점을 자동 검사한다 (기준 7)
                         #   재무(kr_stock, dart_fin, 원): 공개일 다음 거래일부터 보이는 최신 값
                         #     재무상태(최근 분기말): equity(자본총계, 연결이면 비지배지분 포함), total_assets, total_liabilities,
                         #       current_assets, current_liabilities, noncurrent_assets, noncurrent_liabilities, capital_stock, retained_earnings
                         #     손익 TTM(최근 4개 분기 3개월 값 합, 4분기 = 연간 − 3분기 누적): revenue_ttm, operating_income_ttm,
                         #       pretax_income_ttm, net_income_ttm. 4개 분기가 다 없거나 연결·별도가 섞이면 NaN
                         #     지배주주: net_income_controlling_ttm (연결 지배기업 소유주 귀속, 별도만 내는 회사는 순이익, 못 찾으면 NaN)
                         #     eps_ttm: 지배주주 순이익 TTM ÷ (보통주 + 우선주 상장주식수, 자사주 미차감), 그날 주식 기준 원.
                         #       보통주 코드만 (우선주는 NaN). PER = raw_close / eps_ttm (수정주가 close와 나누지 않는다)
                         #     PBR·PER·ROE는 market_cap과 같이 받아 strategy.py에서 계산 (예시: valuation())
                         #   재무(us_stock, edgar_facts, USD): equity, shares_outstanding, revenue_ttm, operating_income_ttm,
                         #     net_income_ttm(= net_income_controlling_ttm, 1순위 태그가 지배주주 귀속). 공시일 다음 거래일부터
                         #     4분기 = 연간 − 9개월 누계. 현재 구성종목만(생존편향). EPS는 아직 없다
                         #   시가총액(us_stock, USD): market_cap = us_1d 원본 종가 × 분할 보정 주식수 (EDGAR 공시일 다음 거래일부터,
                         #     주식수 기준일이 400일 넘으면 NaN). shares = 그 주식수(종가와 같은 분할 기준), cik = 회사 번호
                         #     회사 단위라 GOOG·GOOGL처럼 한 회사 종목이 여럿이면 둘 다 회사 전체 시총 → 엔진은 빼지 않는다.
                         #     순위·상위 N은 fields에 cik도 적고 cik로 묶어 한 종목만 남긴다 (예시: strategy.py top_by_mcap)
                         #     한계: V 5~20% 작게, 1:1 아닌 합병 종목(LIN·DD 등)은 합병 전 비어 있음, 생존편향. report에 결측률·이상치 종목
                         #     시가총액도 엔진이 cut 전 공시만으로 다시 만들어 시점을 자동 검사한다
                         #     재무 필드도 엔진이 시점을 자동 검사한다. report에 원천 범위·결측률이 남는다
fin_timing: first        # 재무 공개일: first = 최초 접수일 (배당과 같은 규칙, 정정 값이 최초 접수일부터 보이는 경미한 미래참조)
                         #             last  = 마지막 접수일 filed (보수적, 정정된 보고서는 정정일까지 안 보임)
                         #   us_stock: first = 최초 공시값 (정정 전 원래 숫자, 미래참조 없음)
                         #             last  = 그날까지 최신 공시값 (10-K/A 정정·재작성 값을 그 공시일부터 반영)
                         #   dart_fin은 정정 전 원래 값을 저장하지 않는다. 결과가 둘 사이에서 크게 다르면 validator에 알린다
fill: next_open          # next_open (다음 봉 시가 체결) | next_close (다음 봉 종가)
funding: true            # crypto_futures: 펀딩비 반영 (binance_um_funding). 봉 동안 든 포지션 × 그 봉에 정산된 비율 합,
                         #   롱은 양수 비율에 내고 숏은 받는다. data.funding으로 신호에도 쓸 수 있다 (봉 끝에 알려진 값)
                         #   false면 미반영 (비교용, report에 표시)
currency: ""             # us_stock: KRW면 그날 원/달러(ECOS)로 환산해 환율 변동까지 수익에 넣음
dividend_tax:            # 배당 재투자 때 떼는 비율 (0이면 전액). 비우면 us_stock 원천징수 15%, kr_stock 배당소득세 15.4%
                         #   kr_stock 가격은 배당락일에 세후 배당을 재투자한 총수익 (kr_dividend_schedule)

execution:               # 비워 두면 비중만 계산 (자본 1 기준, 소수점 주식, 매 봉 리밸런싱)
  capital:               # 초기 자본 (예: 10000000). 주면 평가액·투입액·XIRR을 같이 낸다
  monthly_contribution:  # 매월 첫 봉 적립금 (예: 1000000)
  whole_shares: false    # true면 정수 주식만 (capital이나 적립금 필요)
  rebalance: on_signal      # always | on_change (바뀐 종목·적립금 때만, 비중 합이 1을 넘을 수 있음) | on_signal (신호를 낸 봉·목표가 바뀐 봉에 전 종목 맞춤, 월 리밸런싱용)
  sizing: next_open      # 수량을 언제 정하나 (체결은 fill 그대로)
                         #   next_open:  체결 가격으로 목표 비중을 정확히 맞춤 (기본, 지금까지의 결과)
                         #   prev_close: paper 데스크처럼 신호 봉 종가로 수량 = 비중 × 자산 ÷ 종가. 시가·종가 차이만큼 비중이 어긋난 채로 체결
                         #               (paper로 갈 lab이면 이쪽이 운용 결과에 더 가깝다. 정수 주식이면 현금 부족 시 매수 축소)

data_snapshot: ""        # 사용한 데이터 스냅샷 ID (재현용)

trials:                  # 시도 횟수 — 다중 검정 판단용. 통과 기준을 바꾸지 않고, 많을수록 validator가 더 엄격하게 본다
  count: 1               # 이 아이디어 계열로 개발 구간 결과를 본 횟수. 파라미터만 바꾼 재실행, --quick 실행, 이전 version 실행도 모두 센다
                         #   백테스트를 돌리기 전에 +1 하고 log에 한 줄 적은 뒤 커밋한다 (가설 커밋 검사와 같이)
  exposed_from: [L008]       # 이 아이디어가 이미 개발 구간을 본 lab의 판정·결과에서 나왔으면 그 lab ID (예: [L001]). 없으면 비움
                         #   그 경우 출처 lab의 시도 횟수도 이 계열의 시도로 본다
  log: ["2026-11-18 v1: 첫 실행 (전체, 민감도 포함)"]                # 실행마다 한 줄: "YYYY-MM-DD v1: 바꾼 것" (예: "2026-11-16 v1: lookback 120→60")

walk_forward:
  start: "2011-01-01"      # 개발 구간 시작일 (시험 2013~)
  train: 24M             # 학습 창 길이
  test: 6M               # 시험 창 길이 (이만큼씩 앞으로 이동)

lockbox:                 # 판정 시 자동 기록 (실행일 기준 최근 6개월)
  start: ""
  end: ""
  opened: false          # 한 번 열면 true. 이후 전략을 바꾸면 version +1

costs:                   # 비워 두면 config/settings.yaml 기본값 사용
  fee_pct:
  slippage_pct:
  tax_pct_sell:          # 비우면 settings의 연도별 세율표

params: {ma_days: 200}               # 전략 파라미터

benchmark: SPY            # SPY_tr_wht 등 benchmark.py 변형, 또는 universe 안의 종목 (매수 후 보유)

retirement:              # 전략별 퇴출 조건. paper·live 상태면 max_drawdown_pct나 max_losing_days 중 하나 필수.
                         # paper 데스크가 매 봉 감시하고, 걸리면 텔레그램으로 알린다 (매매는 그대로 — 퇴출은 사람이 status로)
  max_drawdown_pct:      # 예: 개발 구간 MDD × 1.5
  max_losing_days:       # 예: 연속 손실 일수
  custom: ""             # 그 밖의 조건 (예: 펀딩비가 N일 연속 음수)
