# 데이터 수집 설정

binance:
  top_n: 30                    # 거래대금 상위 USDT 페어 수
  start_1m: "2017-08-01"       # 분봉 백필 시작. 아카이브 최초: 현물 2017-08, 선물(UM) 2020-01 (그 전은 파일 없음)
  start_funding: "2020-01-01"
  exclude_bases: [USDC, FDUSD, TUSD, USDP, DAI, EUR, BUSD, USD1, PYUSD, XUSD, RLUSD, USDE, BFUSD, AEUR, EURI, PAXG, XAUT, WBTC]

upbit:
  start_1m: "2017-09-01"       # Binance 유니버스와 겹치는 KRW 페어. 업비트 1분봉은 2017-09(개장)부터 있음

kr:
  start_1d: "2010-01-01"       # 전 종목(상장폐지 포함) 일봉
  minute_universe: [KOSPI200, KOSDAQ150]
  # 분봉은 KIS가 제공하는 만큼(약 1년) 과거로 백필
  requests_per_sec: 15         # KIS 실전 한도 20/s 보다 여유 있게

us:
  start_1d: "2010-01-01"
  universe: [SP500, NASDAQ100]
  benchmarks_1d: [SPY, IVV, VOO]   # 벤치마크 ETF (유니버스와 별도로 일봉만 수집, backtest/benchmark.py가 사용)
  # 1분봉은 yfinance 제공 범위(최근 30일)만 백필 → 이후 매일 누적
  start_1m_sip: "2016-01-01"   # Alpaca 무료 플랜 1분봉(us_1m_sip) 시작. 키가 있어야 수집

dividends:                     # `collect dividends` (collectors/dividends.py)
  dart_start_year: 2015        # 사업보고서 배당 사항 시작 사업연도 (dart_fin과 같은 범위)
  dart_max_calls: 8000         # 실행당 DART 호출 상한. 하루 한도 약 2만을 dart_disclosures·dart_fin과 나눠 쓴다
                               # 배분 순서: 정기보고서 목록 → 배당(dart_dividend) → 기업 연고표 → 사업의 내용 본문 (뒤 단계는 남은 몫만)
  profile_start_year: 2015     # 기업 연고표(임원·타법인 출자·최대주주) 시작 사업연도 (collectors/dart_profile.py)
  business_start_year: 2014    # 사업보고서 '사업의 내용' 본문(dart_business) 시작 사업연도. 최근 연도부터 받는다
  profile_company_refresh_days: 90  # 기업개황(본사 소재지 등, 현재 값만 제공)을 다시 받는 주기 → 변경 이력을 앞으로 쌓는다
  kis_start: "2010-01-01"      # KIS 예탁원 배당 일정(kr_dividend_schedule) 시작. 종목별 조회라 2010~ 전체가 나온다
  kis_refresh_days: 7          # 상장 중인 종목은 이 주기로 다시 조회 (새 배당결정 반영)
  alpaca_start: "2016-01-01"   # Alpaca v1 배당락 이력 시작 (2015 이전은 비어 있음 확인)
  alpaca_ann_start: "2020-01-01"  # Alpaca v2 배당 발표(declaration_date) 이력 시작 (2019 이전은 비어 있음 확인)

kr_public:                     # `collect kr-public` (collectors/kr_public.py)
  dart_owner_max_calls: 8000   # 지배주주 순이익(dart_fin_owner, fnlttSinglAcntAll) 실행당 호출 상한. 연결 보고서 약 7.9만 건 백필 →
                               # 하루 2회 실행이면 약 5일. DART 하루 한도(약 2만)를 dart_disclosures·dart_fin·dart_dividend와 공유

edgar:                         # `collect edgar` (collectors/edgar.py). SEC_USER_AGENT(환경변수 또는 .env) 필요
  refresh_days: 30             # 10-K·10-Q 색인에 안 잡혀도 이 주기로 companyfacts를 다시 받는다
  max_companies_per_run: 600   # 실행당 companyfacts 상한 (유니버스 약 520개라 첫 실행에 전부)
  bulk_min_new: 50             # 처음 받는 종목이 이만큼 이상이면 회사별 API 대신 일괄 파일 companyfacts.zip(약 1.4GB)으로 적재
  # 지주사 재편·합병 존속 등으로 CIK가 바뀐 종목의 옛 CIK (1:1 주식 교환만). 옛 CIK 사실은 새 CIK 첫 공시 전분만 쓴다.
  # 2026-11-17 SEC submissions로 회사명 확인. 주식 교환비가 1:1이 아닌 합병(LIN, DD, BKR, VTRS 등)은 넣지 않는다.
  predecessors:
    XOM: [34088]               # Exxon Mobil Corp → ExxonMobil Holdings (2026)
    DIS: [1001039]             # 옛 Walt Disney Co (TWDC Enterprises 18) → 2019 Fox 인수 때 새 지주사
    GOOGL: [1288776]           # Google Inc. → Alphabet (2015-10)
    GOOG: [1288776]
    BLK: [1364742]             # BlackRock (2024 GIP 인수 때 새 지주사)
    AVGO: [1441634, 1649338]   # Avago → Broadcom Ltd (2016) → Broadcom Inc (2018)
    CI: [701221]               # 옛 Cigna (2018 Express Scripts 인수 때 새 지주사)
    ICE: [1174746]             # 2013 NYSE 인수 때 새 지주사
    ETN: [31277]               # Eaton Corp → Eaton plc (2012)
    MDT: [64670]               # Medtronic Inc → plc (2015)
    APA: [6769]                # Apache Corp → APA Corp (2021)
    STE: [815065]              # STERIS Corp → plc (2015)
    TPL: [97517]               # Texas Pacific Land Trust → Corp (2021)
    BG: [1144519]              # Bunge Ltd → Bunge Global (2023)
    APO: [1411494]             # Apollo Global Management (2022 Athene 합병 때 새 지주사)
    MRVL: [1058057]            # Marvell Technology Group Ltd → Inc (2021)
  # 클래스별 표지 주식수(edgar_class_shares): 차원 없는 주식수 사실이 있는 10-K·10-Q 비율이 이보다 낮은 CIK만 공시별 xbrl.zip 수집
  class_min_coverage: 0.5
  class_force_ciks: [1067983]  # BRK: 2009~2011 차원 없는 표지 값이 A주 수뿐이라 비율과 관계없이 클래스별로
  class_max_filings: 1500      # 실행당 xbrl.zip 상한 (공시당 약 0.5~1MB)

us_shares:                     # 분할 보정 주식수·시가총액 도우미 (src/autotrader/data/shares.py)
  max_age_days: 400            # 마지막 주식수 공시가 이보다 오래되면 NaN (10-K만 내는 회사도 1년 + 여유)
  # 클래스별 주식수(edgar_class_shares) → 그 종목(상장 클래스) 주식으로 환산하는 비율. 키는 member 이름의 일부.
  # 적은 클래스: 오늘 기준 단위라 분할 보정을 하지 않는다. 0이면 뺀다.
  # 안 적은 클래스: 1, 그 종목 분할 보정 적용 (GOOGL A·B·C처럼 함께 분할되고 경제적 권리가 같은 경우).
  class_ratio:
    BRK-B: {CommonClassAMember: 1500}     # A주 1주 = B주 1,500주 (2010-01-21 B주 50:1 분할 이후)
    V: {CommonClassB: 0, CommonClassC: 0}  # B·C주는 전환비가 시기마다 바뀌어 뺀다 → V 시총 약 5~20% 작게 잡힘

naver:                         # `collect naver-trend`, `collect naver-news` (collectors/naver.py). NAVER_CLIENT_ID/SECRET 필요
  # NAVER API HUB는 "한시적 무료, 유료 전환 시 사전 공지". 과금·인증 오류 응답이면 수집기가 멈추고 알린다 (비용은 사용자 승인).
  # 호출 수는 data/state.sqlite의 api_calls 표에 KST 날짜별로 센다 (재시도 포함). 한도에 닿으면 저장하고 다음 실행에 이어받는다.
  trend:                       # 검색어 트렌드. 공식 한도 월 50,000건
    max_calls_per_day: 2000    # 백필 약 1.3만 요청(종목 약 2,900개 ÷ 5 × 창 22개) → 약 7일. 매일 갱신 약 600요청
    max_calls_per_month: 45000 # 공식 한도보다 여유
    refresh_tail_days: 14      # 매일 갱신 창은 처음 받을 때 전체, 그 뒤로는 끝 14일만 저장 (전날 것과 겹쳐 잇기)
    extra_keywords: []         # 종목명 말고 더 받을 검색어 (예: "OO 테마주"). 전략부 요청을 받아 개발부가 넣는다
  news:                        # 뉴스 검색. 공식 한도는 문서마다 하루 25,000 / 월 775,000건 (작은 쪽 기준)
    max_calls_per_day: 3000
    max_calls_per_month: 60000
    theme_queries: [관련주, 테마주, 특징주, 수혜주, 상한가]
    theme_max_pages: 11        # 질의당 최신 1,099건까지 (API 상한: start ≤ 1000, display ≤ 100 → 마지막 쪽 start=1000)
    surge_pct: 15              # krx_1d 최근 거래일 상승률 이 % 이상 종목명도 질의 (상한가 30% 포함)
    max_stock_queries: 60      # 급등 종목 질의 상한 (상승률 큰 순)
    stock_max_pages: 2
  news_backfill:               # 뉴스 과거 백필 ("{종목명} 특징주", 전 쪽). `collect naver-news`가 live 다음에 같은 실행에서 돈다
    # 공식 한도(API HUB 문서 2026-09-17판): 검색 API 하루 25,000회 (뉴스·블로그 등 검색 API 합산), 초과 시 429.
    # 몫: live 하루 상한 3,000 + 백필 8,000 = 11,000 (공식의 44%). 천장 = 오늘 live+백필 합계가 이 값이면 백필만 멈춤.
    enabled: true
    templates: ["{name} 특징주"] # 2차로 "{name} 관련주"를 더하면 호출 약 2배
    max_calls_per_day: 8000
    max_calls_per_month: 120000
    search_day_ceiling: 20000  # 25,000 − live 상한 3,000 − 여유 2,000
    max_attempts: 3            # 400 등으로 실패한 질의를 다시 시도하는 횟수
