# 리스크 한도 (src/autotrader/risk). 값은 착수 후 투자 금액이 정해지면 조정. 지금은 보수적인 자리표시 값.
#
# 두 층으로 나뉜다 (docs/architecture.md §10):
# - 계좌 보호 (global·orders·data_staleness·position_guard·approval): 모든 전략 유형에 적용.
#   버그·사고·폭주를 막는 용도이고 전략의 모양(종목 수·종목 비중)은 바꾸지 않는다.
# - 신호형 전략 사이징 (trade): type: trade lab에만. 값은 lab.yaml trade 블록이 정하고 백테스트에 들어간다.
#   여기서는 lab이 안 정했을 때의 기본값과, lab이 넘을 수 없는 상한만 둔다.
#   비중형(type: portfolio)은 목표 비중이 곧 사이징이라 이 블록을 쓰지 않는다.

global:
  kill_switch: false            # true면 신규 매수 전면 중단 (위험을 줄이는 매도는 허용)
  max_daily_loss_pct: 2.0       # 일일 손실이 총자산의 2% 넘으면 당일 신규 매수 중단
  max_drawdown_pct: 10.0        # 고점 대비 10% 하락 시 신규 매수 중단 + 알림 (사람이 풀 때까지)

trade:
  defaults:                     # lab.yaml trade 블록에 없는 값
    risk_per_trade_pct: 1.0     # 거래당 위험 (손절까지 잃는 돈 / 총자산)
    max_heat_pct: 6.0           # 열린 포지션 전체 위험 합계
    max_position_pct: 5.0       # 종목 하나 최대 비중
    max_sector_pct: 30.0
    max_open_positions: 10
    kelly: half                 # 백테스트 승률·손익비가 있으면 하프 Kelly를 위험 비율의 상한으로만 사용 (none이면 안 씀)
  caps:                         # lab이 이보다 크게 정하면 실행 거부 (더 엄하게는 가능)
    risk_per_trade_pct: 2.0
    max_heat_pct: 20.0

orders:
  max_gross_weight: 1.0         # 비중형: 목표 비중 합 상한 (1 = 레버리지 없음). 넘거나 음수 비중이면 그날 주문 전부 보류 + 알림
  max_order_value_krw: 1000000  # 1회 주문 최대 금액 (실전 초기엔 작게)
  max_orders_per_minute: 20     # 버그로 인한 주문 폭주 방지
  require_limit_orders: true    # 시장가 주문 금지 (스캘핑 전략만 예외 허용 예정)
  min_notional_check: true      # 계산된 주문 금액이 거래소 최소 주문 금액보다 작으면 BLOCK하고 사유 기록
                                # (소액 계좌에서 비중 한도 × 자본 < 최소 주문이면 전략이 영원히 0주를 내는 문제 방지)

data_staleness:
  # 시세가 이 시간보다 오래되면 해당 시장 신규 주문 중단 (옛 데이터로 판단하지 않는다)
  max_quote_age_sec: {kr_stock: 30, us_stock: 30, crypto: 10}
  # 보유 포지션의 시세를 이 횟수 연속 못 받으면 "측정 불가 포지션"으로 보고 정리 + 알림
  unmeasurable_retries: 3

position_guard:
  # 보유 포지션 감시 (전략이 정한 손절·목표가를 리스크팀이 독립적으로 집행)
  enforce_stop_loss: true
  enforce_take_profit: true
  flat_before_close_min: {kr_stock: 10, us_stock: 10}   # 당일 청산 전략은 장 마감 N분 전 정리
  check_interval_sec: 5

approval:
  # 실전 초기에는 주문마다 텔레그램 승인을 받는다 (응답 없으면 주문하지 않음)
  live_manual_approval: true
  approval_timeout_sec: 120
  auto_after_live_trades: 20    # 실전 체결 N건이 문제없이 쌓이면 자동 모드 전환 검토

live_gate:
  # lab 검증 기준은 labs/README.md. 여기서는 모의투자 → 실전 전환 조건만 다룸
  min_paper_trading_days: 20
  # 모의투자 성과가 백테스트 기대치에서 크게 벗어나지 않아야 함
  max_paper_vs_backtest_gap_pct: 50
  # 실전은 소액으로 시작 (전략별 초기 배정 상한)
  initial_live_allocation_krw: 500000
